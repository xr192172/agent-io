name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── TS 主工程：类型检查 + 构建（跨平台矩阵） ───
  # ★ 2026-10-04：原「单元测试（vitest）」一步已删 —— 框架整体移除（见提交说明）。
  # ★ 2026-10-05：原「契约变更 / README 工具数 / 能力矩阵 / STALE BUILD」等零依赖闸门已删 ——
  #   不再自养门（用户裁定）。验证靠 `npm run build` 与下方 archify vendor 自检。
  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 + 构建（tsc + gen bundle）
        run: npm run build
      # archify 已 vendor 进 third_party/，doctor 会校验「每类型的 renderer + schema + example」
      # 三件套完整。精简化 vendor 时若误删 examples/ 或 renderers/，这一步会直接报 not ready
      # （此前靠本机全局 ARCHIFY_ROOT 指向仓外副本，CI 上该分支永远绿 → 从没被发现）。
      # R5 线挂起时（AGENT_IO_R5_SKIP=1）跳过：该线虽保留在仓内但暂不开发，不该拖累主线 CI。
      - name: archify vendor 自检（renderer + schema + example 三件套完整）
        if: ${{ env.AGENT_IO_R5_SKIP != '1' }}
        run: node third_party/archify/bin/archify.mjs doctor

  # ─── Go 语言包（observe）：源码插桩 + 进程内采集 ───
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [observe-lang-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          # ★ `cache: false` 是必需的，不是优化：该 module **无 require**（纯标准库）⇒ 仓里没有 go.sum。
          #   而 setup-go 的 `cache` **默认就是 true**，此时它会去找 go.sum，找不到就**让步骤失败**：
          #     "Restore cache failed: Dependencies file is not found ... Supported file pattern: go.sum"
          #   ⚠ 我第一版改法是"去掉 cache-dependency-path"，那只是让它回退到默认查找 ⇒ **照样失败**
          #   （这次真跑 CI 才暴露：本地 `go build`/`go vet` 全绿，看不出这个差别）。
          cache: false
      - name: 编译
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: Go 测试
        run: go test ./...
        working-directory: ${{ matrix.module }}

  # ─── 总门（2026-10-05 接入）：npm run verify ───
  #
  # ★ 为什么单独一个 job，而不是塞进 node-test：
  #   `verify` 的 Go 两道门需要 Go 工具链，而 node-test 的矩阵里没有 setup-go
  #   ⇒ 放那里两道 Go 门会 SKIP，而 **verify 在有门 SKIP 时返回 2**（刻意区别于 0）
  #   ⇒ 那个 job 会永远红。**这正是 verify 三态设计的用意：跑不了要说成跑不了。**
  #
  # ★ 它在 CI 上**新增**的覆盖（其余与既有 job 重叠）：
  #   · mcp_scan          —— 全部工具的入参/出参签名（坏签名 ⇒ LLM 一定调错）
  #     ★ 2026-10-13：这里原写"59 个工具" —— **手维护的数字已经漂了**（实测 69）⇒ **删掉数字**，
  #       别改成 69（会再漂）。真值看 `TOOL_DEFS`；`verify` 自己会打印当次总数。
  #   ★ 2026-10-13 更正：原写"另含 measure_b_contract（b 项契约占位符）"—— **那道门已于
  #     2026-10-12（T195）撤除**（本仓不再自养门；见 `scripts/verify.mjs` 同处注释）⇒ 别再照旧注释找它。
  #   另含 tsc（node-test 的 build 已覆盖）与 Go build/vet（go-test 已覆盖）。
  #   ★ **不重加已被裁掉的门**：ci.yml 原注释记载 2026-10-05 移除了「契约变更 / README 工具数 /
  #     能力矩阵 / STALE BUILD」等零依赖闸门（用户裁定"不再自养门"）—— verify **不含**它们。
  #   ★ 也不含 `go test`（那由 go-test job 负责）⇒ **verify 不是"全部检查"，是"提交前的总门"**。
  #   ★ 当次门数/名称一律以 `verify` 的输出为准（**本注释不写死门数** —— 它已经漂过一次：
  #     原写"五门"（含 b 项契约），撤成四门后注释没跟）。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          # ★ 同 go-test：仓里没有 go.sum（该 module 纯标准库）⇒ 必须显式关掉缓存，
          #   否则 setup-go 默认去找 go.sum、找不到就让本步骤失败。
          cache: false
      - run: npm ci
      # ★ 必须先 build：`mcp_scan` 那道门要读 `dist/src/presentation/cli/cli.js`
      #   （它故意走 CLI 入口而不是直接调 `invokeTool`，因为 CLI 不做 zod 校验 ——
      #     守卫有没有接上，只有走 CLI 入口才看得见 ⇒ 这个 dist 依赖是**设计如此**，不是将就）。
      #   ⚠ 我第一版 verify job 只跑 `npm ci` 就直接 verify ⇒ CI 上没有 dist ⇒ 那道门必然失败。
      #   **本地跑不出来**：本地一路都在 build，dist 一直在。
      - name: 构建（mcp_scan 需要 dist/）
        run: npm run build
      - name: 总门（★ 门名/门数以 verify 自身输出为准 —— 本仓刻意不在此写死）
        run: npm run verify
