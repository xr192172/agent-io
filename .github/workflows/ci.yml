name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── TS 主工程：类型检查 + 构建 + 零依赖闸门（跨平台矩阵） ───
  # ★ 2026-10-04：原「单元测试（vitest）」一步已删 —— 框架整体移除（见提交说明）。
  #   留下的闸门全是 `scripts/*.mjs` 零依赖脚本，它们不依赖任何测试框架。
  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装依赖
        run: npm ci
      # 质量闸门（防 skip hook / 纯本地校验漏网）：build 后跑，因契约闸门需 dist 的 ts_kernel
      - name: 类型检查 + 构建（tsc + gen bundle）
        run: npm run build
      - name: STALE BUILD 自检（build 后应无 stale；有则说明产物与源码不一致）
        run: node --input-type=module -e "import('./dist/src/tools/stale_check.js').then(async m=>{const r=m.checkStaleBuild(process.cwd());console.log('scanned '+r.scanned+' stale '+r.stale);if(r.stale){console.log(m.formatStaleText(r));process.exit(1)}})"
      - name: 契约变更闸门（新增/改名残留未同步文档 → 阻断）
        run: node scripts/contract_docs_gate.mjs
      - name: README 工具数自检（共注册 N 个 == server_registry 真实数）
        run: node scripts/readme_tools_gate.mjs --check
      - name: 能力矩阵漂移闸门（实现触达语言但声明漏登记 → 阻断）
        run: node scripts/capability_scan.mjs --check
      # archify 已 vendor 进 third_party/，doctor 会校验「每类型的 renderer + schema + example」
      # 三件套完整。精简化 vendor 时若误删 examples/ 或 renderers/，这一步会直接报 not ready
      # （此前靠本机全局 ARCHIFY_ROOT 指向仓外副本，CI 上该分支永远绿 → 从没被发现）。
      # R5 线挂起时（AGENT_IO_R5_SKIP=1）跳过：该线虽保留在仓内但暂不开发，不该拖累主线 CI。
      - name: archify vendor 自检（renderer + schema + example 三件套完整）
        if: ${{ env.AGENT_IO_R5_SKIP != '1' }}
        run: node third_party/archify/bin/archify.mjs doctor

  # ─── Go 插桩组件：go-observe / go-slim ───
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [go-observe, go-slim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: 编译
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: Go 测试
        run: go test ./...
        working-directory: ${{ matrix.module }}
