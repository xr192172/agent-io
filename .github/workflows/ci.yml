name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── TS 主工程：类型检查 + 构建（跨平台矩阵） ───
  # ★ 2026-10-04：原「单元测试（vitest）」一步已删 —— 框架整体移除（见提交说明）。
  # ★ 2026-10-05：原「契约变更 / README 工具数 / 能力矩阵 / STALE BUILD」等零依赖闸门已删 ——
  #   不再自养门（用户裁定）。验证靠 `npm run build`。
  # ★ 2026-11-25：原 archify vendor 自检步骤已删 —— 自包含 HTML 管线与整棵 third_party/archify
  #   vendor 已于 e23d3f4d 整体下线，残留步骤指向已删脚本（干净克隆 MODULE_NOT_FOUND），随管线一并移除。
  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 + 构建（tsc + gen bundle）
        run: npm run build

  # ─── Go 语言包（observe）：源码插桩 + 进程内采集 ───
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [observe-lang-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          # ★ `cache: false` 是必需的，不是优化：该 module **无 require**（纯标准库）⇒ 仓里没有 go.sum。
          #   而 setup-go 的 `cache` **默认就是 true**，此时它会去找 go.sum，找不到就**让步骤失败**：
          #     "Restore cache failed: Dependencies file is not found ... Supported file pattern: go.sum"
          #   ⚠ 我第一版改法是"去掉 cache-dependency-path"，那只是让它回退到默认查找 ⇒ **照样失败**
          #     （这次真跑 CI 才暴露：本地 `go build`/`go vet` 全绿，看不出这个差别）。
          cache: false
      - name: 编译
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: Go 测试
        run: go test ./...
        working-directory: ${{ matrix.module }}

  # ─── 总门 · 跨平台子集车道（方案 B：linux） ───
  #
  # ★ 2026-11-25（CI-fix 方案 B）：原单 verify job（ubuntu 全量）拆成两条车道。门→车道归属
  #   唯一权威 = 仓根 `env-contract.json` 的 `gates` 节；本 job 跑 `--lane linux` 收录的跨平台
  #   子集（tsc / 工具链 / Go 两门 / 纯 TS 契约与判据 / 结构门…），车道外的门记 SKIP-unsupported
  #   单列（既有三态诚实口径，不折 PASS，不是 SKIP 凑绿）。
  #
  # ★ 过渡期测试门整体归 windows 绑定腿（Java/Maven 夹具与 spawn 腿需本机工具链）；本 linux 腿
  #   不跑测试门，ubuntu 测试覆盖缺口属 deferred（测试文件级 lane 豁免留后批专卡，见回执隔离清单）。
  #
  # ★ 派生库口径（规划 §3.2）：design-db 是设计册纯投影，CI 由 `design:gen-db` bootstrap；
  #   cache.db / tasks.db 归本机/云主机探针，CI 诚实 unsupported（对应门 lanes=[]，本 job SKIP 单列）。
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          # ★ 同 go-test：仓里没有 go.sum（该 module 纯标准库）⇒ 必须显式关掉缓存。
          cache: false
      - run: npm ci
      # ★ 必须先 build：`MCP 工具签名` 那道门读 dist/ CLI 入口（设计如此，不是将就）。
      - name: 构建（mcp_scan 需要 dist/）
        run: npm run build
      # ★ design-db 纯投影 bootstrap（gitignored 派生，CI 可由册确定性重建）。
      - name: Bootstrap design-db 投影
        run: npm run design:gen-db
      - name: 总门 · linux 跨平台子集（门名/门数以 verify 自身输出为准）
        run: node scripts/verify.mjs --lane linux

  # ─── 总门 · Windows 绑定腿（方案 B：windows-latest） ───
  #
  # ★ Windows-only 门诚实归位：Java/Maven 夹具、spawn 形态等平台绑定腿在此真跑（不 SKIP 凑绿）。
  #   工具链与 `env-contract.json` tools 节同源：node 22 / go stable / java 17 / maven。
  #   过渡期测试门归本腿；cache.db / tasks.db 相关门在本腿同样 unsupported 单列（本机活态，CI 不重建）。
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ★ F-①（2026-11-25）：原 `actions/setup-maven@v5` 步骤删除 —— 该 action 仓库不存在
      #   （Actions 报 "Unable to resolve action actions/setup-maven, repository not found"，job 2s 失败）。
      #   windows-latest 镜像预装 Maven（mvn 在 PATH），无需第三方 setup action；java 17 由上面 setup-java 提供。
      - run: npm ci
      - name: 构建（mcp_scan 需要 dist/）
        run: npm run build
      - name: Bootstrap design-db 投影
        run: npm run design:gen-db
      - name: 总门 · Windows 绑定腿（门名/门数以 verify 自身输出为准）
        run: node scripts/verify.mjs --lane windows
      # ★ 取证（任务 #188）：设计册判据 34 unsupported 的逐条 kind/detail 在 runner 侧门日志里，
      #   汇总行只有计数；`if: always()` ⇒ 闸红/判不了时日志照样上传，供归因闭环。不改任何判定。
      - name: 上传 Windows 门日志明细（unsupported 归因取证）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-windows-logs
          path: .agent-io/scratch/verify-last/
          if-no-files-found: warn
          retention-days: 7
