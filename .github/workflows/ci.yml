name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── TS 主工程：类型检查 + 构建（跨平台矩阵） ───
  # ★ 2026-10-04：原「单元测试（vitest）」一步已删 —— 框架整体移除（见提交说明）。
  # ★ 2026-10-05：原「契约变更 / README 工具数 / 能力矩阵 / STALE BUILD」等零依赖闸门已删 ——
  #   不再自养门（用户裁定）。验证靠 `npm run build` 与下方 archify vendor 自检。
  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 + 构建（tsc + gen bundle）
        run: npm run build
      # archify 已 vendor 进 third_party/，doctor 会校验「每类型的 renderer + schema + example」
      # 三件套完整。精简化 vendor 时若误删 examples/ 或 renderers/，这一步会直接报 not ready
      # （此前靠本机全局 ARCHIFY_ROOT 指向仓外副本，CI 上该分支永远绿 → 从没被发现）。
      # R5 线挂起时（AGENT_IO_R5_SKIP=1）跳过：该线虽保留在仓内但暂不开发，不该拖累主线 CI。
      - name: archify vendor 自检（renderer + schema + example 三件套完整）
        if: ${{ env.AGENT_IO_R5_SKIP != '1' }}
        run: node third_party/archify/bin/archify.mjs doctor

  # ─── Go 插桩组件：go-observe / go-slim ───
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [go-observe, go-slim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: 编译
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: Go 测试
        run: go test ./...
        working-directory: ${{ matrix.module }}
